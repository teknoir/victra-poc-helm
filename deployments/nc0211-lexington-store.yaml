---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nc0211-lexington-store
  namespace: default
spec:
  repo: https://teknoir.github.io/victra-poc-helm
  chart: victra-poc
  version: 0.1.2-beta.16
  targetNamespace: default
  valuesContent: |-
    nvr:
      defaults:
        debugLevel: DEBUG

        camera:
          pipeline: "{{ template \"defaultPipeline\" . }}"

      instances:
        - name: nc0211-pos
          camera:
            uri: rtsp://admin:Redex1997!@192.168.51.113/stream1
            pipelineValues:
              videoRecorder:
                segmentCount: 8640
    

        - name: nc0211-height-strip
          camera:
            uri: rtsp://admin:Redex1997!@192.168.51.112/live.sdp
            pipelineValues:
              videoRecorder:
                segmentCount: 8640
    

        - name: nc0211-front-door-1
          camera:
            motion:
              activeInterval: "0"
            uri: rtsp://admin:Redex1997!@192.168.51.117/stream1
            #pipeline: "{{ template \"defaultPipelineReIdSWINb1024Tracker\" . }}"
            pipelineValues:
              videoRecorder:
                segmentCount: 8640
              rtspSrc:
                width: 2560
                height: 1440


        - name: nc0211-front-door-2
          camera:
            motion:
              activeInterval: "0"
            uri: rtsp://admin:Redex1997!@192.168.51.116/live.sdp
            #pipeline: "{{ template \"defaultPipelineReIdSWINb1024Tracker\" . }}"
            pipelineValues:
              videoRecorder:
                segmentCount: 8640
              rtspSrc:
                width: 2560
                height: 1440

    
        #- name: nc0211-backroom-safe-door-0
        #  camera:
        #    uri: rtsp://admin:Redex1997!@192.168.51.115/stream1
        #    pipeline: "{{ template \"default360Pipeline\" . }}"
        #    pipelineValues:
        #      rtspSrc:
        #        width: 4000
        #        height: 3000
        #  nvdewarper:
        #    enabled: true
        #    config: "{{ template \"360NvDeWarper\" . }}"
        #  nvdewarperValues:
        #    pitch: 30
        #    roll: 0
    
    
        - name: nc0211-backroom-safe-door-90
          camera:
            uri: rtsp://admin:Redex1997!@192.168.51.115/stream1
            pipeline: "{{ template \"default360Pipeline\" . }}"
            pipelineValues:
              videoRecorder:
                segmentCount: 8640
              rtspSrc:
                width: 4000
                height: 3000
          nvdewarper:
            enabled: true
            config: "{{ template \"360NvDeWarper\" . }}"
          nvdewarperValues:
            pitch: 30
            roll: 90


        - name: nc0211-backroom-safe-door-180
