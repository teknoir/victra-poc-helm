              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"
              lc-config:
                lc-back-room-Entry-0: "920;428;874;622;746;592;1002;653"
                lc-back-room-Exit-0: "827;817;874;622;1002;653;746;592"

            - name: nc0211-sales-floor-0
