    observatory-pipeline:
      defaults:
        debugLevel: DEBUG

        image:
          #tag: dev-33e6cee
          tag: feature-sort-cutouts-1e67a9a

        labels:
          deviceID: "victra-poc-03"

        lineCrossing:
          intervalMs: 5000 # milliseconds
          windowMs: 10000 # milliseconds
          dejitterBatchMs: 10000 # milliseconds
          dejitterBatchCount: 3000
          
        roiStreamConfig:
          enabled: true
          peripherals:
            - name: nc0211-pos
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"
              lc-config:
                lc-pos-Entry-0=1029;380;1029;580;893;580;1165;580
                lc-pos-Exit-0=1029;780;1029;580;1165;580;893;580

            - name: nc0211-height-strip
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"

            - name: nc0211-front-door-1
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;425;0;406;472;726;499;719;698;1920;779;1920;1080;0;1090"
              lc-config:
                lc-Entry-0: "879;497;862;697;762;688;962;705"
                lc-Exit-0: "844;896;862;697;962;705;762;688"

            - name: nc0211-front-door-2
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;639;274;644;218;87;452;41;479;654;1129;650;1142;470;1498;471;1526;0;1920;0;1920;1080;0;1080"
              lc-config:
                lc-Entry-0: "997;448;998;648;900;649;1096;648"
                lc-Exit-0: "999;848;998;648;1096;648;900;649"
            #    lc-Entry-0: "1004;413;1007;613;910;615;1104;612"
            #    lc-Exit-0: "1010;813;1007;613;1104;612;910;615"

            - name: nc0211-backroom-safe-door-90
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"
              lc-config:                
                lc-back-room-Entry-0: "1354;502;1344;702;1171;693;1517;710"
                lc-back-room-Exit-0: "1334;901;1344;702;1517;710;1171;693"

            - name: nc0211-backroom-safe-door-180
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"
              lc-config:
