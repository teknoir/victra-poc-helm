              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"

            - name: nc0211-sales-floor-90
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;262;0;297;100;465;102;498;212;873;214;863;0;1054;0;1046;207;1433;215;1466;108;1663;111;1706;0;1920;0;1920;1080;0;1080"

            - name: nc0211-sales-floor-180
