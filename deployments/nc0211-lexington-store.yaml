              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"

            - name: nc0211-sales-floor-270
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"

      streams:
        - stream: update-frame-rate-control
        - stream: record-detections
        - stream: update-movements
        - stream: compreface
          mqtt:
            topicFaces: "toe/events/faces"
          facerec:
            compreFaceApiKey: "00000000-0000-0000-0000-000000000002"
            faceRecThreshold: 0.992
        # ALERTS
        - stream: loitering
        - stream: person-down
        - stream: line-crossing
        - stream: hands-up
        - stream: running
        - stream: weapons
          #alerts:
          #  weaponCutoutMinSize: 0
          #weaponsDetection:
          #  scoreThreshold: 0.3
          #  window: 1
        - stream: safe-open
        - stream: backdoor-open
        - stream: facerec-cutout
        - stream: person-cutout
        - stream: pos-event
          video:
            segmentRetentionLength: 8640
        - stream: alarm-event
        - stream: unauthorized-entry
        - stream: face-cover-detections
          faceCoverDetection:
            threshold: 0.9
            windowSize: 8000
            slidingInterval: 1000
        - stream: extended-occupancy
        # ALERT PROCESSING
        - stream: update-alerts
          video:
            segmentRetentionLength: 8640

      file-transfer:
        defaults:
          image:
            tag: dev-c0862d1
          labels:
            deviceID: "victra-poc-03"
    
      # DEBUG NOT FOR PRODUCTION
      clickhouse:
        nodePort:
          enabled: true
      keydb:
        nodePort:
          enabled: true
