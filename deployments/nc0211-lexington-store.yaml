                lc-back-room-Exit-0: "817;1025;827;826;952;832;702;819"

            - name: nc0211-backroom-safe-door-270
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"

            - name: nc0211-safe-back-door-0
              config-width: 1920
              config-height: 1080
              roi-config:
                roi-loitering-Exclusion-Zone-0: "0;0;1920;0;1920;1080;0;1080"

            - name: nc0211-safe-back-door-180
